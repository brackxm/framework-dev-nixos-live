name: One-time rebuild of minimal NixOS live ISO

# Explicitly requested one-time build. Remove this file after publishing.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-minimal-once.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate SSH public key
        run: bash scripts/check-keys.sh
      - name: Validate ISO release script syntax
        run: bash -n scripts/publish-iso-release.sh
      - uses: cachix/install-nix-action@v31
      - name: Require pinned flake inputs
        run: |
          test -f flake.lock
          nix flake metadata --no-update-lock-file >/dev/null
      - name: Build minimal bootstrap ISO
        run: nix build .#bootstrapIso --print-build-logs -o result
      - name: Check that source branch did not move during build
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ -z "$remote_sha" || "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Source branch changed during build; refusing to publish from a stale commit."
            exit 1
          fi
      - name: Create minimal ISO draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-iso-release.sh bootstrap
