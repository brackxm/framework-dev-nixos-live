name: Check Nix flake (no build)

# Explicitly dispatched only; no build, push, or PR triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate both profiles without building
        run: nix flake check --no-build --show-trace --all-systems
