name: Check Nix flake (no build)

# Manually dispatched only; evaluates live, installed and SSD image profiles.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate live and installed profiles without building
        run: nix flake check --no-build --show-trace --all-systems
