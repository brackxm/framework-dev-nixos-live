name: One-time deletion of superseded bootstrap ISO release

# Remove this temporary workflow after it has completed.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-old-bootstrap-release-once.yml

permissions:
  contents: write

jobs:
  delete-old-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify replacement and superseded releases, then delete only the old one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          new_json="$(gh api "repos/$GH_REPO/releases/428154219")"
          jq -e '
            .id == 428154219 and
            .tag_name == "iso-bootstrap-40916427932-a1" and
            .draft == true and
            .target_commitish == "cdaa2bd7746bec9d6b96d78189d61369b21f374d" and
            ([.assets[] | select(.name == "SHA256SUMS" and .state == "uploaded")] | length) == 1 and
            ([.assets[] | select(.name == "nixos-minimal-26.05.20261028.08d3a97-x86_64-linux.iso" and .state == "uploaded")] | length) == 1
          ' <<< "$new_json" > /dev/null
          old_json="$(gh api "repos/$GH_REPO/releases/423654549")"
          jq -e '
            .id == 423654549 and
            .tag_name == "iso-bootstrap-40232322979-a1" and
            .draft == true and
            .target_commitish == "0913800b947d4f2ce6867552565c3fd8e2fa0b47" and
            ([.assets[] | select(.name == "nixos-minimal-26.05.20261025.1f607aa-x86_64-linux.iso" and .state == "uploaded")] | length) == 1
          ' <<< "$old_json" > /dev/null
          gh api --method DELETE "repos/$GH_REPO/releases/423654549"
          echo "Deleted only the superseded draft iso-bootstrap-40232322979-a1 (release ID 423654549)."
