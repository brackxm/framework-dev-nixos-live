name: Build NixOS SSD Image

# Temporary one-shot trigger for an explicitly requested SSD build.
# Only changes to this workflow on feat/nixos-installed can trigger it.
on:
  push:
    branches: [feat/nixos-installed]
    paths:
      - .github/workflows/build-ssd-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write  # Required to create a GitHub draft release.
    steps:
      - uses: actions/checkout@v4
      - name: Check publication script syntax
        run: bash -n scripts/publish-ssd-release.sh
      - name: Free runner disk space for the image build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: cachix/install-nix-action@v31
      - name: Check locked flake inputs
        run: |
          test -f flake.lock
          nix flake metadata --no-update-lock-file >/dev/null
      - name: Build UEFI/GPT SSD raw image
        run: nix build .#ssdImage --print-build-logs -o result
      - name: Verify disk image partition table
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(result/*.img)
          test "${#images[@]}" -eq 1
          file "${images[0]}"
          sfdisk -d "${images[0]}" | tee /tmp/ssd-partitions.txt
          grep -q '^label: gpt' /tmp/ssd-partitions.txt
          python3 - "${images[0]}" <<'PY'
          import json, subprocess, sys
          j = json.loads(subprocess.check_output(["sfdisk", "--json", sys.argv[1]]))
          parts = j["partitiontable"]["partitions"]
          assert len(parts) == 2, f"Expected EFI and root partitions, got {len(parts)}"
          assert parts[0]["type"].upper() == "C12A7328-F81F-11D2-BA4B-00A0C93EC93B", parts[0]
          assert parts[1]["type"].upper() == "0FC63DAF-8483-4772-8E79-3D69D8477DE4", parts[1]
          print("Partition layout verified: GPT, EFI System, Linux root")
          PY
      - name: Ensure release targets current branch HEAD
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [[ -z "$remote_sha" || "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The source branch moved during the build (started at $GITHUB_SHA; now ${remote_sha:-unknown}). Do not publish an older commit; launch a fresh workflow run."
            exit 1
          fi
      - name: Upload compressed chunks to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-ssd-release.sh

      - name: Restore manual-only workflow after successful draft release
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true # Workflow-file writes may be restricted by GITHUB_TOKEN.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build-ssd-image.yml")
          original = """# Temporary one-shot trigger for an explicitly requested SSD build.
# Only changes to this workflow on feat/nixos-installed can trigger it.
on:
  push:
    branches: [feat/nixos-installed]
    paths:
      - .github/workflows/build-ssd-image.yml
  workflow_dispatch:
"""
          restored = """# Manual dispatch only; no automatic build on push or PR.
on:
  workflow_dispatch:
"""
          current = p.read_text()
          if current.count(original) != 1:
              raise SystemExit("Expected one-shot trigger missing or modified")
          current = current.replace(original, restored, 1)
          # Remove this one-time cleanup step by keeping only the original workflow.
          marker = "\n      - name: Restore manual-only workflow after successful draft release\n"
          if current.count(marker) != 1:
              raise SystemExit("Cleanup step marker missing")
          current = current.split(marker, 1)[0].rstrip() + "\n"
          p.write_text(current)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-ssd-image.yml
          git commit -m "ci: restore manual-only SSD build after successful release [skip ci]"
          git push origin "HEAD:refs/heads/feat/nixos-installed"
